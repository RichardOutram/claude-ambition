<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neon Solar Implosion — 10s Loop</title>
<style>
  html, body { margin: 0; height: 100%; background: #02000a; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 24px; bottom: 22px; right: 24px;
    font: 500 11px/1.4 "Courier New", monospace; letter-spacing: 0.35em;
    color: #9ff; text-shadow: 0 0 8px #0ff, 0 0 18px #f0f; pointer-events: none;
    text-transform: uppercase; opacity: 0.8;
  }
  #bar { margin-top: 8px; height: 2px; background: rgba(255,255,255,0.08); }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, #0ff, #f0f, #ff0);
          box-shadow: 0 0 10px #f0f, 0 0 20px #0ff; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud"><span id="label">orbit</span><div id="bar"><div id="fill"></div></div></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const LOOP = 10.0;           // seconds
const TAU = Math.PI * 2;
const IMPLODE_END = 0.575;   // loop phase where the singularity detonates

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02000a);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);

// ---------- deterministic RNG ----------
let seed = 1337;
const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const randSphere = () => {
  const u = rand() * 2 - 1, t = rand() * TAU, s = Math.sqrt(1 - u * u);
  return [s * Math.cos(t), u, s * Math.sin(t)];
};

// ---------- particle buffers ----------
const P = { orbit: [], angle: [], k: [], tilt: [], rnd: [], size: [], offset: [], dir: [], color: [] };
const tmpC = new THREE.Color();
function push(orbit, angle, k, tilt, offset, color, size, intensity = 1) {
  P.orbit.push(orbit); P.angle.push(angle); P.k.push(k); P.tilt.push(tilt);
  P.rnd.push(rand()); P.size.push(size);
  P.offset.push(...offset);
  const d = randSphere(); d[1] *= 0.55;               // explosion: flattened nebula
  const l = Math.hypot(...d); P.dir.push(d[0] / l, d[1] / l, d[2] / l);
  tmpC.set(color).multiplyScalar(intensity);
  P.color.push(tmpC.r, tmpC.g, tmpC.b);
}

// Sun — dense neon core
const sunColors = ['#fff36b', '#ffae00', '#ff2fa0', '#ff5a1f', '#ffffff'];
for (let i = 0; i < 18000; i++) {
  const r = 3.4 * Math.pow(rand(), 1.8);
  const s = randSphere();
  push(0, 0, 0, 0, [s[0] * r, s[1] * r, s[2] * r],
       sunColors[Math.floor(rand() * sunColors.length)], 1.1 + rand() * 1.6, 0.8);
}

// Planets: orbit radius, revolutions per loop (integer → seamless), planet radius, color
const planets = [
  { r: 7.0,  k: 5, pr: 0.55, c: '#00f0ff' },
  { r: 10.0, k: 4, pr: 0.85, c: '#ff3cf2' },
  { r: 13.5, k: 3, pr: 0.95, c: '#39ff6a' },
  { r: 17.0, k: 3, pr: 0.7,  c: '#ff5533' },
  { r: 23.0, k: 2, pr: 2.1,  c: '#ffb300' },
  { r: 28.5, k: 2, pr: 1.7,  c: '#c86bff', ring: true },
  { r: 33.5, k: 1, pr: 1.25, c: '#2fd2ff' },
  { r: 38.5, k: 1, pr: 1.15, c: '#4b5bff' },
];
planets.forEach((pl, i) => {
  const tilt = (i % 2 ? 1 : -1) * (0.02 + 0.015 * i);
  const a0 = rand() * TAU;
  // planet body
  for (let j = 0; j < 2500; j++) {
    const s = randSphere(), r = pl.pr * Math.pow(rand(), 0.35);
    push(pl.r, a0, pl.k, tilt, [s[0] * r, s[1] * r, s[2] * r], pl.c, 0.9 + rand() * 1.2, 1.0);
  }
  // ring around the 6th planet
  if (pl.ring) {
    for (let j = 0; j < 3500; j++) {
      const rr = pl.pr * (1.5 + rand() * 1.1), t = rand() * TAU;
      let x = Math.cos(t) * rr, z = Math.sin(t) * rr, y = (rand() - 0.5) * 0.06;
      const ct = Math.cos(0.45), st = Math.sin(0.45);           // tilt ring
      push(pl.r, a0, pl.k, tilt, [x, y * ct - z * st, y * st + z * ct], '#ff7bf0', 0.6 + rand() * 0.6, 0.7);
    }
  }
  // orbit trail dust
  for (let j = 0; j < 5000; j++) {
    const jit = (rand() - 0.5) * 0.35;
    push(pl.r + jit, rand() * TAU, pl.k, tilt, [0, (rand() - 0.5) * 0.12, 0], pl.c, 0.35 + rand() * 0.5, 0.28);
  }
});

// Asteroid belt
for (let i = 0; i < 9000; i++) {
  const r = 19.2 + (rand() - 0.5) * 2.6;
  push(r, rand() * TAU, 2, 0, [0, (rand() - 0.5) * 0.6, 0],
       rand() < 0.5 ? '#9dfcff' : '#ffd36b', 0.4 + rand() * 0.8, 0.55);
}

const N = P.rnd.length;
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(N * 3), 3));
geo.setAttribute('aOrbit', new THREE.Float32BufferAttribute(P.orbit, 1));
geo.setAttribute('aAngle', new THREE.Float32BufferAttribute(P.angle, 1));
geo.setAttribute('aK', new THREE.Float32BufferAttribute(P.k, 1));
geo.setAttribute('aTilt', new THREE.Float32BufferAttribute(P.tilt, 1));
geo.setAttribute('aRand', new THREE.Float32BufferAttribute(P.rnd, 1));
geo.setAttribute('aSize', new THREE.Float32BufferAttribute(P.size, 1));
geo.setAttribute('aOffset', new THREE.Float32BufferAttribute(P.offset, 3));
geo.setAttribute('aDir', new THREE.Float32BufferAttribute(P.dir, 3));
geo.setAttribute('aColor', new THREE.Float32BufferAttribute(P.color, 3));
geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 200);

const particleMat = new THREE.ShaderMaterial({
  uniforms: {
    uP: { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uScale: { value: innerHeight / 2 },
  },
  vertexShader: /* glsl */`
    uniform float uP, uPixelRatio, uScale;
    attribute float aOrbit, aAngle, aK, aTilt, aRand, aSize;
    attribute vec3 aOffset, aDir, aColor;
    varying vec3 vColor;
    varying float vAlpha;
    const float TAU = 6.28318530718;
    const float DET = ${IMPLODE_END.toFixed(4)};
    mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

    void main(){
      float p = uP;

      // ---- resting solar system (periodic over the loop) ----
      float ang = aAngle + TAU * aK * p;
      vec3 orbit = vec3(cos(ang) * aOrbit, 0.0, sin(ang) * aOrbit);
      orbit.yz = rot(aTilt) * orbit.yz;
      vec3 off = aOffset * (1.0 + 0.08 * sin(TAU * (3.0 * p + aRand)));
      vec3 home = orbit + off;

      // ---- implosion: spiral into an accretion disk, then a point ----
      float a = smoothstep(0.16 + aRand * 0.10, 0.56, p);
      float pull = pow(a, 1.7);
      vec3 imp = home * (1.0 - pull);
      imp.y *= 1.0 - 0.85 * pull;
      imp.xz = rot(-pull * pull * (5.0 + 40.0 / (aOrbit + 3.0))) * imp.xz;

      // ---- detonation: neon nebula blast ----
      float b = smoothstep(DET, 0.75, p);
      float eb = 1.0 - pow(1.0 - b, 3.0);
      vec3 blast = aDir * eb * (16.0 + aRand * 48.0);
      blast.xz = rot(eb * (1.2 + aRand)) * blast.xz;

      // ---- reformation: curl back into orbits ----
      float c = smoothstep(0.66 + aRand * 0.10, 0.985, p);
      vec3 back = home;
      back.xz = rot((1.0 - c) * (1.0 - c) * -3.0) * back.xz;
      vec3 pos = p < DET ? imp : mix(blast, back, c * c * (3.0 - 2.0 * c));

      // ---- color / size ----
      float heat = p < DET ? pull : (1.0 - b) * (1.0 - c);
      vec3 hot = mix(vec3(1.0, 0.95, 1.0), vec3(0.6, 0.9, 1.0), aRand);
      vColor = mix(aColor, hot * 1.2, heat * 0.75);
      // blast phase: shift hue toward electric magenta/cyan
      float burst = p < DET ? 0.0 : b * (1.0 - c);
      vColor = mix(vColor, mix(vec3(1.0, 0.1, 0.9), vec3(0.1, 1.0, 1.0), aRand) * 1.4, burst * 0.6);

      float twinkle = 0.65 + 0.35 * sin(TAU * (7.0 * p + aRand * 3.0));
      vAlpha = twinkle;

      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      float sz = aSize * (1.0 - 0.45 * pull) * (1.0 + 1.3 * burst);
      gl_PointSize = sz * uPixelRatio * uScale * 0.4 / -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor;
    varying float vAlpha;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if (d > 0.5) discard;
      float glow = smoothstep(0.5, 0.0, d);
      float core = exp(-d * d * 60.0);
      gl_FragColor = vec4(vColor * (glow * 0.5 + core * 1.3) * vAlpha, 1.0);
    }`,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
const system = new THREE.Points(geo, particleMat);
scene.add(system);

// ---------- background starfield ----------
{
  const n = 6000, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  const palette = ['#ffffff', '#8ff', '#f8f', '#ffd', '#88f'];
  for (let i = 0; i < n; i++) {
    const s = randSphere(), r = 300 + rand() * 500;
    pos.set([s[0] * r, s[1] * r, s[2] * r], i * 3);
    tmpC.set(palette[i % palette.length]).multiplyScalar(0.3 + rand() * 0.7);
    col.set([tmpC.r, tmpC.g, tmpC.b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  var stars = new THREE.Points(g, new THREE.PointsMaterial({
    size: 1.6, sizeAttenuation: false, vertexColors: true,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  }));
  scene.add(stars);
}

// ---------- flash + shockwave sprites ----------
function radialTexture(stops) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const flashTex = radialTexture([[0, 'rgba(255,255,255,1)'], [0.12, 'rgba(255,220,255,0.9)'],
  [0.35, 'rgba(255,40,200,0.35)'], [0.7, 'rgba(60,0,255,0.08)'], [1, 'rgba(0,0,0,0)']]);
const ringTex = radialTexture([[0, 'rgba(0,0,0,0)'], [0.82, 'rgba(0,0,0,0)'],
  [0.93, 'rgba(255,255,255,1)'], [0.96, 'rgba(255,255,255,0.4)'], [1, 'rgba(0,0,0,0)']]);

const flash = new THREE.Sprite(new THREE.SpriteMaterial({
  map: flashTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
}));
scene.add(flash);

const rings = [
  { color: 0x00ffff, rx: -Math.PI / 2, rz: 0,    delay: 0.0,  speed: 1.0 },
  { color: 0xff00e6, rx: -Math.PI / 2 + 0.5, rz: 0.3, delay: 0.015, speed: 0.8 },
  { color: 0xfff200, rx: -Math.PI / 2 - 0.35, rz: -0.6, delay: 0.03, speed: 0.65 },
].map(o => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({
    map: ringTex, color: o.color, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  }));
  m.rotation.set(o.rx, 0, o.rz);
  scene.add(m);
  return { mesh: m, ...o };
});

// ---------- post processing ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.3, 0.65, 0.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- animation ----------
const smooth = (e0, e1, x) => { const t = Math.min(Math.max((x - e0) / (e1 - e0), 0), 1); return t * t * (3 - 2 * t); };
const label = document.getElementById('label'), fill = document.getElementById('fill');

function frame(ms) {
  const p = ((ms / 1000) % LOOP) / LOOP;
  particleMat.uniforms.uP.value = p;

  // singularity charge & detonation flash
  const charge = smooth(0.3, IMPLODE_END, p);
  const boom = p >= IMPLODE_END ? Math.exp(-(p - IMPLODE_END) * 22) : 0;
  // punch: rises through the collapse, relaxes after detonation (continuous, 0 at loop seam)
  const punch = p < IMPLODE_END ? charge : 1 - smooth(IMPLODE_END, 0.85, p);
  const f = p < IMPLODE_END ? charge * charge * 0.6 : boom;
  flash.material.opacity = Math.min(1, f * 1.2 + 0.15 * (1 - punch));
  flash.scale.setScalar(8 + charge * 10 + boom * 90);

  // shockwaves
  rings.forEach(r => {
    const t = (p - IMPLODE_END - r.delay) / 0.3;
    const on = t > 0 && t < 1;
    r.mesh.visible = on;
    if (on) {
      const e = 1 - Math.pow(1 - t, 3);
      r.mesh.scale.setScalar(1 + e * 70 * r.speed);
      r.mesh.material.opacity = Math.pow(1 - t, 1.5) * 1.4;
    }
  });

  // camera: periodic drift, punch-in during implosion, shake at detonation
  const sway = Math.sin(TAU * p);
  const dist = 72 - punch * 18;
  const ca = 0.7 + 0.35 * sway, el = 0.42 + 0.12 * Math.sin(TAU * p + 1.2);
  const shake = boom * 1.2;
  camera.position.set(
    Math.cos(ca) * Math.cos(el) * dist + Math.sin(ms * 0.09) * shake,
    Math.sin(el) * dist + Math.sin(ms * 0.13) * shake,
    Math.sin(ca) * Math.cos(el) * dist);
  camera.lookAt(0, 0, 0);
  camera.fov = 55 - punch * 6 + boom * 10;
  camera.updateProjectionMatrix();

  stars.rotation.y = 0.05 * sway;
  bloom.strength = 1.25 + punch * 0.6 + boom * 1.6;

  label.textContent = p < 0.16 ? 'orbit' : p < IMPLODE_END ? 'collapse' :
                      p < 0.7 ? 'detonation' : 'rebirth';
  fill.style.width = (p * 100).toFixed(2) + '%';

  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  particleMat.uniforms.uScale.value = innerHeight / 2;
});
</script>
</body>
</html>
