<!doctype html><meta charset="utf-8"><body style="margin:0"><iframe id="f" style="border:0;height:1000px"></iframe><pre id="out"></pre>
<script>
const q = new URLSearchParams(location.search), page = q.get('page'), W = +q.get('w');
const f = document.getElementById('f'); f.style.width = W + 'px'; f.src = page;
const parse = c => { const m = c.match(/rgba?\(([^)]+)\)/); if (!m) return null; const p = m[1].split(/[ ,\/]+/).filter(Boolean).map(Number); return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 }; };
const lin = v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; };
const lum = c => .2126 * lin(c.r) + .7152 * lin(c.g) + .0722 * lin(c.b);
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const blend = (fg, bg, a) => ({ r: fg.r * a + bg.r * (1 - a), g: fg.g * a + bg.g * (1 - a), b: fg.b * a + bg.b * (1 - a) });
f.onload = () => setTimeout(() => {
  const win = f.contentWindow, doc = f.contentDocument, R = {};
  const de = doc.documentElement;
  R.width = W; R.overflow = de.scrollWidth - de.clientWidth;
  // contrast
  const fails = []; let n = 0, min = 99;
  doc.querySelectorAll('body *').forEach(el => {
    if (['SCRIPT', 'STYLE'].includes(el.tagName) || el.closest('.sr')) return;
    const own = [...el.childNodes].some(x => x.nodeType === 3 && x.textContent.trim());
    if (!own) return;
    const r = el.getBoundingClientRect(); if (!r.width || !r.height) return;
    const cs = win.getComputedStyle(el); let fg = parse(cs.color); if (!fg) return;
    let op = 1; for (let e = el; e; e = e.parentElement) op *= +win.getComputedStyle(e).opacity;
    const chain = []; for (let e = el; e; e = e.parentElement) { const c = parse(win.getComputedStyle(e).backgroundColor); if (c && c.a > 0) { chain.push(c); if (c.a === 1) break; } }
    let bg = { r: 255, g: 255, b: 255 }; chain.reverse().forEach(c => bg = blend(c, bg, c.a));
    const col = blend(fg, bg, fg.a * op); const cr = ratio(col, bg);
    const px = parseFloat(cs.fontSize), large = px >= 24 || (px >= 18.66 && +cs.fontWeight >= 700);
    const need = large ? 3 : 4.5; n++; min = Math.min(min, cr);
    if (cr < need) fails.push(el.textContent.trim().slice(0, 30) + ' ' + cr.toFixed(2) + '<' + need);
  });
  R.contrastChecked = n; R.minContrast = +min.toFixed(2); R.contrastFails = [...new Set(fails)].slice(0, 8);
  // structure (v2 only)
  const plans = [...doc.querySelectorAll('.plan')];
  if (plans.length) {
    R.h1 = doc.querySelectorAll('h1').length;
    R.unlabelledInputs = [...doc.querySelectorAll('input')].filter(i => !i.labels || !i.labels.length).length;
    R.emptyButtons = [...doc.querySelectorAll('button,a')].filter(b => !b.textContent.trim()).length;
    const price = p => parseFloat(win.getComputedStyle(p.querySelector('.amt')).fontSize);
    const feat = plans.find(p => p.classList.contains('featured')), others = plans.filter(p => p !== feat);
    R.featPriceBiggest = others.every(o => price(feat) > price(o));
    const bgs = plans.map(p => win.getComputedStyle(p).backgroundColor); R.featOnlyDistinctBg = bgs.filter(b => b === bgs[plans.indexOf(feat)]).length === 1;
    const tops = plans.map(p => p.getBoundingClientRect().top); R.featFirstOrHighest = tops[plans.indexOf(feat)] === Math.min(...tops);
    const cta = feat.querySelector('.btn.primary'); R.featHasFilledCTA = !!cta && cta.getBoundingClientRect().width > 0;
    R.otherPrimaryButtonsInCards = others.filter(o => o.querySelector('.btn.primary')).length;
    if (W >= 1024) {
      // price math + sync with table
      const m = [];
      doc.querySelectorAll('.amt[data-m]').forEach(a => { const mo = +a.dataset.m, yr = +a.dataset.y, card = a.closest('.plan'); const sv = +card.querySelector('.save-line').dataset.save, billed = card.querySelector('.billed').dataset.y;
        m.push(Math.abs(yr - mo * .8) < .01 && sv === (mo - yr) * 12 && billed.includes('$' + yr * 12)); });
      R.priceMathOK = m.every(Boolean) && m.length === 2;
      const txt = s => doc.querySelector(s) ? doc.querySelector(s).innerText : '';
      const t = doc.querySelector('table').innerText.replace(/\s+/g, ' '), st = plans[0].innerText, sd = plans[2].innerText;
      R.cardsMatchTable = st.includes('3 active clients') && st.includes('5 invoices per month') && /Clients\s*3\s*Unlimited/.test(t) && /Invoices per month\s*5\s*Unlimited/.test(t) && sd.includes('Up to 5 team members') && /Team members\s*1\s*1\s*5/.test(t);
      // toggle + picker
      const out = [];
      doc.getElementById('monthly').click(); out.push([...doc.querySelectorAll('.amt')].map(e => e.textContent).join(','));
      doc.getElementById('yearly').click(); out.push([...doc.querySelectorAll('.amt')].map(e => e.textContent).join(','));
      const set = (n, c, tm) => { doc.getElementById('inv').value = n; doc.getElementById('cli').value = c; doc.getElementById('team').checked = tm; doc.getElementById('inv').dispatchEvent(new Event('input')); return doc.querySelector('.is-pick h2').textContent; };
      out.push(set(3, 2, false), set(8, 2, false), set(3, 6, false), set(3, 2, true));
      R.toggleAndPicker = out.join(' | ');
      R.pickerOK = out.join('|') === '$0,$15,$35|$0,$12,$28|Starter|Freelancer|Freelancer|Studio';
      const A = [], grab = () => doc.getElementById('invLines').innerText.replace(/\s+/g, ' ') + ' || ' + doc.querySelector('.inv-total').innerText.replace(/\s+/g, ' ') + ' || ' + doc.getElementById('invNote').textContent;
      doc.getElementById('yearly').click();
      set(8, 2, false); A.push(grab()); set(3, 2, true); A.push(grab()); set(3, 2, false); A.push(grab());
      doc.getElementById('monthly').click();
      set(8, 2, false); A.push(grab()); set(3, 2, true); A.push(grab());
      R.invoice = A;
      R.invoiceOK = A[0].includes('Freelancer plan · $12.00 × 12 months $144.00') && A[0].includes('14-day free trial −$144.00') && /Due today\s*\$0\.00/i.test(A[0]) && A[0].includes('Keep Freelancer for $144.00 a year') && A[1].includes('Studio plan · $28.00 × 12 months $336.00') && A[1].includes('Keep Studio for $336.00 a year') && A[2].includes('Starter plan $0.00') && !A[2].includes('trial ends') && A[3].includes('Freelancer plan · 1 month $15.00') && A[3].includes('Keep Freelancer for $15.00 a month') && A[4].includes('Studio plan · 1 month $35.00') && A[4].includes('Keep Studio for $35.00 a month');
      R.dbg = [A[0].includes('Freelancer plan · $12.00 × 12 months $144.00'), A[0].includes('14-day free trial −$144.00'), /Due today\s*\$0\.00/i.test(A[0]), A[0].includes('Keep Freelancer for $144.00 a year'), A[1].includes('Studio plan · $28.00 × 12 months $336.00'), A[1].includes('Keep Studio for $336.00 a year'), A[2].includes('Starter plan $0.00'), !A[2].includes('trial ends'), A[3].includes('Freelancer plan · 1 month $15.00'), A[3].includes('Keep Freelancer for $15.00 a month'), A[4].includes('Studio plan · 1 month $35.00'), A[4].includes('Keep Studio for $35.00 a month')].map(Number).join('');
      R.dateOK = win.trialEnd(new Date(2026, 10, 24)) === 'Dec 8, 2026' && win.trialEnd(new Date(2026, 11, 25)) === 'Jan 8, 2027' && win.trialEnd(new Date(2028, 1, 20)) === 'Mar 5, 2028';
      doc.querySelectorAll('details').forEach(d => d.open = true); R.faqCount = doc.querySelectorAll('details').length;
    }
  }
  document.getElementById('out').textContent = JSON.stringify(R);
}, 600);
</script>
