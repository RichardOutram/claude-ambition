<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferrofluid Zoetrope</title>
<style>
  :root { --ink:#14042b; --orange:#ff6a00; --violet:#6a1bd8; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--ink); cursor:crosshair; }
  body {
    background:
      radial-gradient(60% 55% at 50% 58%, #ff7a1a 0%, #e0306e 28%, #5a12b8 58%, #14042b 100%);
  }
  canvas { display:block; position:fixed; inset:0; }
  /* zoetrope slits: dark bars that step sideways once per frame */
  #slits {
    position:fixed; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:.55;
    background-image: repeating-linear-gradient(90deg, rgba(20,2,45,.9) 0 7px, rgba(20,2,45,0) 7px 72px);
  }
  #vignette {
    position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(75% 70% at 50% 50%, transparent 55%, rgba(12,0,30,.85) 100%);
  }
  #flash { position:fixed; inset:0; pointer-events:none; background:#ffb347; mix-blend-mode:screen; opacity:0; }
  #hud {
    position:fixed; left:16px; bottom:14px; right:16px; display:flex; justify-content:space-between;
    font:600 11px/1.3 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing:.14em; text-transform:uppercase;
    color:#ffd9a8; text-shadow:0 0 8px #ff6a00; pointer-events:none; opacity:.85;
  }
</style>
</head>
<body>
<div id="slits"></div>
<div id="vignette"></div>
<div id="flash"></div>
<div id="hud"><span id="frame">frame 000 / 120</span><span>move the pointer · you are the magnet</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const FPS = 12, LOOP = 10, FRAMES = FPS * LOOP; // 120 zoetrope frames per 10 s loop
  const TAU = Math.PI * 2;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);

  // ---------- ferrofluid surface ----------
  const geo = new THREE.PlaneGeometry(10, 10, 560, 560);
  const uniforms = {
    uMag:   { value: [new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4()] },
    uFrame: { value: 0 },
    uFlick: { value: 1 },
    uCam:   { value: new THREE.Vector3() }
  };

  const vert = `
    uniform vec4 uMag[3];
    uniform float uFrame;
    varying vec3 vN; varying vec3 vW; varying vec2 vP; varying float vCone; varying float vF;

    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    const float S = 0.27;

    vec3 surf(vec2 p, out float f, out float cone){
      f = 0.0; vec2 lean = vec2(0.0);
      for (int i = 0; i < 3; i++){
        vec2 d = uMag[i].xy - p;
        float k = uMag[i].z / (1.0 + dot(d, d) * 2.4);
        f += k;
        lean += d / (length(d) + 0.25) * k;
      }
      float mask = smoothstep(4.7, 3.6, length(p));
      f *= mask;

      // hexagonal Rosensweig lattice
      vec2 q = p / S;
      vec2 r = vec2(1.0, 1.7320508); vec2 h = r * 0.5;
      vec2 a = mod(q, r) - h; vec2 b = mod(q - h, r) - h;
      vec2 g = dot(a, a) < dot(b, b) ? a : b;
      vec2 id = q - g;
      float jit = hash(id);
      float c = pow(max(0.0, 1.0 - length(g) / 0.56), 1.65);

      float amp = smoothstep(0.2, 1.15, f) * (0.88 + 0.24 * fract(sin(uFrame * 12.9898 + jit * 78.233) * 437.585));
      float hgt = 0.30 * f + 0.82 * amp * c * (0.8 + 0.4 * jit);
      cone = c * amp;
      vec2 off = lean * 0.10 * hgt * mask;
      return vec3(p.x + off.x, hgt, p.y + off.y);
    }

    void main(){
      vec2 p = position.xy;
      float f, c, f1, c1;
      vec3 P  = surf(p, f, c);
      float e = 0.012;
      vec3 Px = surf(p + vec2(e, 0.0), f1, c1);
      vec3 Pz = surf(p + vec2(0.0, e), f1, c1);
      vN = normalize(cross(Pz - P, Px - P));
      vW = P; vP = p; vCone = c; vF = f;
      gl_Position = projectionMatrix * viewMatrix * vec4(P, 1.0);
    }
  `;

  const frag = `
    uniform vec3 uCam; uniform float uFlick; uniform float uFrame;
    varying vec3 vN; varying vec3 vW; varying vec2 vP; varying float vCone; varying float vF;

    vec3 pal(float x){
      x = clamp(x, 0.0, 1.0);
      vec3 c0 = vec3(0.09, 0.02, 0.24);  // ink violet
      vec3 c1 = vec3(0.40, 0.09, 0.80);  // electric violet
      vec3 c2 = vec3(0.93, 0.16, 0.50);  // hot magenta
      vec3 c3 = vec3(1.00, 0.42, 0.02);  // cadmium orange
      vec3 c4 = vec3(1.00, 0.82, 0.38);  // butter
      if (x < 0.25) return mix(c0, c1, x / 0.25);
      if (x < 0.50) return mix(c1, c2, (x - 0.25) / 0.25);
      if (x < 0.75) return mix(c2, c3, (x - 0.50) / 0.25);
      return mix(c3, c4, (x - 0.75) / 0.25);
    }

    void main(){
      float rad = length(vP);
      if (rad > 4.9) discard;

      vec3 n = normalize(vN);
      vec3 V = normalize(uCam - vW);
      vec3 L = normalize(vec3(-0.55, 0.85, 0.45));

      float lam = dot(n, L) * 0.5 + 0.5;
      // painterly brush streaks that re-roll each zoetrope frame
      float ph = floor(mod(uFrame, 3.0));
      float brush = sin(vW.x * 17.0 + sin(vW.z * 4.0 + ph * 2.1) * 2.6 + ph) * 0.5 + 0.5;
      float t = lam + (brush - 0.5) * 0.14;
      float band = floor(t * 5.0) / 4.0;
      t = mix(t, band, 0.7);

      vec3 col = pal(t * 0.72 + vCone * 0.38 - 0.08 + vF * 0.06);

      // complementary rim: orange on violet, violet on orange
      float fr = pow(1.0 - max(dot(n, V), 0.0), 2.6);
      vec3 rimC = mix(vec3(1.0, 0.45, 0.0), vec3(0.45, 0.1, 1.0), step(0.55, t));
      col = mix(col, rimC, fr * 0.65);

      // hard, posterised wet specular
      vec3 R = reflect(-L, n);
      float s = pow(max(dot(R, V), 0.0), 38.0);
      col = mix(col, vec3(1.0, 0.96, 0.85), smoothstep(0.35, 0.45, s));

      // dish rim
      col *= mix(0.45, 1.0, smoothstep(4.9, 4.4, rad));
      col = mix(col, vec3(1.0, 0.5, 0.05), smoothstep(0.05, 0.0, abs(rad - 4.78)) * 0.9);

      gl_FragColor = vec4(col * uFlick, 1.0);
    }
  `;

  const surface = new THREE.Mesh(geo, new THREE.ShaderMaterial({
    uniforms, vertexShader: vert, fragmentShader: frag, side: THREE.DoubleSide
  }));
  surface.frustumCulled = false;
  scene.add(surface);

  // ---------- magnet markers ----------
  function makeMagnet(color) {
    const g = new THREE.Group();
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.045, 10, 40),
      new THREE.MeshBasicMaterial({ color }));
    ring.rotation.x = Math.PI / 2;
    const core = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0x2a0870 }));
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 1, 6),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.45 }));
    stem.position.y = -0.5;
    g.add(ring, core, stem);
    g.userData = { ring, stem };
    scene.add(g);
    return g;
  }
  const markers = [makeMagnet(0xffd060), makeMagnet(0xff6a00), makeMagnet(0xb066ff)];

  // ---------- pointer magnet ----------
  const ray = new THREE.Raycaster();
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const ndc = new THREE.Vector2();
  const hit = new THREE.Vector3();
  const pointer = { x: 0, z: 0, active: false, last: -1e9 };
  const pm = { x: 0, z: 0, s: 0 };

  addEventListener('pointermove', (e) => {
    ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(plane, hit)) {
      const r = Math.hypot(hit.x, hit.z), lim = 4.0;
      const k = r > lim ? lim / r : 1;
      pointer.x = hit.x * k; pointer.z = hit.z * k;
      pointer.last = performance.now();
    }
  });
  addEventListener('pointerleave', () => { pointer.last = -1e9; });

  function resize() {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.fov = camera.aspect < 0.8 ? 58 : 38;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  // ---------- zoetrope clock ----------
  const slits = document.getElementById('slits');
  const flash = document.getElementById('flash');
  const frameEl = document.getElementById('frame');
  const hash = (n) => { const s = Math.sin(n * 91.345 + 7.13) * 43758.5453; return s - Math.floor(s); };
  const start = performance.now();
  let lastFrame = -1;

  function step(frame) {
    const tq = frame / FPS;              // quantised time, 0..10 s
    const ph = TAU * tq / LOOP;          // loop phase
    const pull = 0.5 + 0.5 * Math.sin(ph * 4); // rhythmic magnet "pull" (4 per loop)

    // orbiting magnets — exactly periodic over 10 s
    const m0 = { x: 2.4 * Math.cos(ph), z: 2.4 * Math.sin(ph), s: 0.75 + 0.45 * pull };
    const m1 = { x: 1.7 * Math.cos(-2 * ph + 1.3), z: 1.3 * Math.sin(-2 * ph + 1.3),
                 s: 0.65 + 0.4 * (0.5 + 0.5 * Math.cos(ph * 3)) };

    // pointer magnet, or a lissajous wanderer when the pointer is idle
    const idle = performance.now() - pointer.last > 2500;
    const tx = idle ? 1.3 * Math.sin(3 * ph) : pointer.x;
    const tz = idle ? 1.0 * Math.sin(2 * ph + 0.5) : pointer.z;
    const ts = idle ? 0.7 + 0.4 * pull : 1.55;
    pm.x += (tx - pm.x) * 0.45; pm.z += (tz - pm.z) * 0.45; pm.s += (ts - pm.s) * 0.35;

    const mags = [pm, m0, m1];
    mags.forEach((m, i) => {
      uniforms.uMag.value[i].set(m.x, m.z, m.s, 0);
      const g = markers[i];
      const y = 1.9 - 0.55 * Math.min(m.s, 1.6) / 1.6;
      g.position.set(m.x, y, m.z);
      g.userData.ring.scale.setScalar(0.8 + 0.35 * m.s);
      g.userData.stem.scale.y = y; g.userData.stem.position.y = -y / 2;
    });

    // camera sway (periodic) + per-frame gate weave
    const wx = (hash(frame) - 0.5) * 0.05, wy = (hash(frame + 31) - 0.5) * 0.05;
    camera.position.set(0.9 * Math.sin(ph) + wx, 5.3 + 0.3 * Math.cos(2 * ph) + wy, 6.6);
    camera.lookAt(0, 0.15, 0.2);
    uniforms.uCam.value.copy(camera.position);
    uniforms.uFrame.value = frame;

    // flicker: brightness jitter, with a bright strobe on each pull peak
    const strobe = frame % (FRAMES / 4) === Math.round(FRAMES / 16) ? 1 : 0;
    uniforms.uFlick.value = 0.86 + 0.18 * hash(frame + 7) + 0.1 * strobe;
    flash.style.opacity = (strobe * 0.35 + hash(frame + 3) * 0.05).toFixed(3);

    // slits step one notch per frame; 120 frames × 3px wraps exactly onto a 72px period
    slits.style.backgroundPositionX = (-(frame * 3) % 72) + 'px';
    slits.style.opacity = (0.42 + 0.2 * hash(frame + 11)).toFixed(3);

    frameEl.textContent = 'frame ' + String(frame + 1).padStart(3, '0') + ' / ' + FRAMES;
  }

  function loop(now) {
    const frame = Math.floor(((now - start) / 1000) * FPS) % FRAMES;
    if (frame !== lastFrame) {           // only advance on zoetrope frame boundaries
      lastFrame = frame;
      step(frame);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
