<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Solar Implosion</title>
<style>
  html, body { margin: 0; height: 100%; background: #010003; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

/*
  10-second loop, every motion is a pure function of t in [0,10):
   0.0 - 3.0  neon solar system in orbit
   3.0 - 6.0  gravitational implosion: everything spirals into the sun
   6.0        singularity flash + shockwave
   6.0 - 9.8  nova rebirth: particles burst out, overshoot, settle on their orbits
  Orbital phases are made loop-exact by folding the leftover angle into the implosion swirl.
*/
const LOOP = 10, TAU = Math.PI * 2;
const params = new URLSearchParams(location.search);
const frozenT = params.has('t') ? parseFloat(params.get('t')) : null;

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);   // deep tint is added in the grade pass
// No built-in tonemap: the final grade pass does a hue-preserving tonemap so neon highlights keep their colour.
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 2000);

// ---------- deterministic random ----------
let seed = 1337;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(TAU * rnd());
const unit = () => { const z = rnd() * 2 - 1, a = rnd() * TAU, s = Math.sqrt(1 - z * z); return [s * Math.cos(a), z, s * Math.sin(a)]; };
const col = h => { const c = new THREE.Color(h); return [c.r, c.g, c.b]; };
const mixc = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];

// ---------- particle buffers ----------
const A = { orbit: [], local: [], dir: [], color: [], misc: [], tilt: [] };
let count = 0;
const angSpeed = r => r <= 0 ? 0 : 1.15 * Math.pow(6 / r, 1.5);
// Extra rotation that closes the loop: total angle over 10 s becomes an exact number of turns.
function closure(r, w) {
  if (r <= 0) return 0;
  const extraTurns = Math.round(THREE.MathUtils.clamp(14 / r, 1, 3));
  return TAU * (Math.ceil(w * LOOP / TAU) + extraTurns) - w * LOOP;
}
function add(o) {
  const w = angSpeed(o.r);
  A.orbit.push(o.r, o.a0, w, closure(o.r, w));
  A.local.push(...o.local);
  A.dir.push(...unit());
  A.color.push(...o.color);
  const jit = rnd() * 0.25;   // planets move as one body (shared delay) so they reform as tight spheres
  const delay = THREE.MathUtils.clamp(1 - o.r / 44, 0, 1) * 0.75 + (o.kind === 1 ? 0.12 : jit);
  A.misc.push(o.size, rnd(), delay, o.kind);
  A.tilt.push(o.incl || 0, o.node || 0, o.spin || 0);
  count++;
}

// Sun: boiling particle sphere + corona
const sunCols = [col('#ffe600'), col('#ff8400'), col('#ff2200'), col('#ff0a78')];
for (let i = 0; i < 26000; i++) {
  const d = unit(), rr = 3.0 * Math.pow(rnd(), 0.25);
  const k = rr / 3.0;
  const c = k < 0.7 ? mixc(sunCols[0], sunCols[1], k / 0.7) : k < 0.92 ? mixc(sunCols[1], sunCols[2], (k - 0.7) / 0.22) : mixc(sunCols[2], sunCols[3], (k - 0.92) / 0.08);
  add({ r: 0, a0: 0, local: [d[0] * rr, d[1] * rr, d[2] * rr], color: c, size: 0.16, kind: 0, spin: 1 });
}
for (let i = 0; i < 9000; i++) {
  const d = unit(), rr = 3.0 + Math.abs(gauss()) * 1.4;
  const c = mixc(col('#ff12b0'), col('#5a14ff'), Math.min(1, (rr - 3) / 3));
  add({ r: 0, a0: 0, local: [d[0] * rr, d[1] * rr, d[2] * rr], color: c, size: 0.12, kind: 0, spin: -1 });
}

// Planets
const planets = [
  { r: 6.0,  R: 0.35, n: 2200,  cols: ['#ff1fd2', '#ff5ee6'], spin: 4, incl: 0.06 },
  { r: 8.6,  R: 0.6,  n: 4000,  cols: ['#ff9a00', '#ff2fa8'], spin: 2, incl: 0.03 },
  { r: 11.2, R: 0.65, n: 5000,  cols: ['#00d9ff', '#2bff5a', '#1f5bff'], spin: 5, incl: 0.0, moon: true },
  { r: 13.8, R: 0.45, n: 3000,  cols: ['#ff1a2e', '#ff6200'], spin: 5, incl: 0.035 },
  { r: 22.5, R: 1.7,  n: 13000, cols: ['#ffb000', '#ff4a00', '#ff2a10', '#ffd820'], spin: 6, incl: 0.02, bands: true },
  { r: 29.0, R: 1.3,  n: 8000,  cols: ['#b4ff00', '#ffb000', '#5dff2a'], spin: 6, incl: 0.04, bands: true, ring: true },
  { r: 35.0, R: 0.95, n: 5000,  cols: ['#00ffc8', '#22e8ff'], spin: 4, incl: 0.015 },
  { r: 40.5, R: 0.95, n: 5000,  cols: ['#2a3cff', '#9a1fff', '#0098ff'], spin: 4, incl: 0.03 },
];
for (const p of planets) {
  const a0 = rnd() * TAU, node = rnd() * TAU, cols = p.cols.map(col);
  for (let i = 0; i < p.n; i++) {
    const d = unit(), rr = p.R * Math.pow(rnd(), 0.18);
    let c;
    if (p.bands) { const b = 0.5 + 0.5 * Math.sin(d[1] * 11 + Math.sin(d[0] * 3) * 0.6); c = mixc(cols[0], cols[1 + (i % (cols.length - 1))], b); }
    else c = mixc(cols[0], cols[1 + (i % (cols.length - 1))], rnd());
    add({ r: p.r, a0, local: [d[0] * rr, d[1] * rr, d[2] * rr], color: c, size: 0.13, kind: 1, incl: p.incl, node, spin: p.spin });
  }
  // atmosphere halo
  for (let i = 0; i < p.n * 0.25; i++) {
    const d = unit(), rr = p.R * (1.05 + Math.abs(gauss()) * 0.25);
    add({ r: p.r, a0, local: [d[0] * rr, d[1] * rr, d[2] * rr], color: cols[0], size: 0.09, kind: 1, incl: p.incl, node, spin: p.spin });
  }
  if (p.ring) {
    const tiltR = 0.45;
    for (let i = 0; i < 12000; i++) {
      const a = rnd() * TAU, rr = p.R * (1.5 + rnd() * 1.3);
      const gap = rr > p.R * 2.2 && rr < p.R * 2.32; if (gap) continue;
      let x = Math.cos(a) * rr, y = gauss() * 0.02, z = Math.sin(a) * rr;
      const y2 = y * Math.cos(tiltR) - x * Math.sin(tiltR), x2 = y * Math.sin(tiltR) + x * Math.cos(tiltR);
      const c = mixc(col('#ffb000'), col('#00ff8c'), (rr / p.R - 1.5) / 1.3);
      add({ r: p.r, a0, local: [x2, y2, z], color: c, size: 0.08, kind: 1, incl: p.incl, node, spin: 1 });
    }
  }
  if (p.moon) {
    for (let i = 0; i < 700; i++) {
      const d = unit(), rr = 0.2 * Math.pow(rnd(), 0.2);
      add({ r: p.r, a0, local: [1.6 + d[0] * rr, d[1] * rr, d[2] * rr], color: col('#9fe8ff'), size: 0.1, kind: 1, incl: p.incl, node, spin: 3 });
    }
  }
  // neon orbit trail
  for (let i = 0; i < 3200; i++) {
    add({ r: p.r + gauss() * 0.018, a0: rnd() * TAU, local: [0, gauss() * 0.012, 0], color: cols[0], size: 0.05, kind: 2, incl: p.incl, node });
  }
}
// Asteroid belt
for (let i = 0; i < 16000; i++) {
  const r = 16.5 + rnd() * 3.2 + gauss() * 0.3;
  const c = mixc(col('#6a3cff'), col('#ff1fc8'), rnd());
  add({ r, a0: rnd() * TAU, local: [0, gauss() * 0.25, 0], color: c, size: 0.09 + rnd() * 0.05, kind: 3, incl: 0.02, node: 1.0 });
}
// Kuiper dust
for (let i = 0; i < 9000; i++) {
  const r = 45 + rnd() * 10;
  add({ r, a0: rnd() * TAU, local: [0, gauss() * 0.8, 0], color: mixc(col('#00c8ff'), col('#4a14ff'), rnd()), size: 0.1, kind: 3, incl: 0.03, node: 2.0 });
}

// ---------- shared shader code ----------
const common = /* glsl */`
  uniform float uTime;
  uniform float uProj;
  uniform float uDim;
  float gF, gStretch, gScatter;   // per-vertex: compression factor, planet streak position (0 head .. 1 tail)
  attribute vec4 aOrbit; attribute vec3 aLocal; attribute vec3 aDir;
  attribute vec3 aColor; attribute vec4 aMisc; attribute vec3 aTilt;
  const float TAU = 6.28318530718; const float PI = 3.14159265359; const float LOOP = 10.0;
  float smoother(float x){ x = clamp(x,0.,1.); return x*x*x*(x*(x*6.-15.)+10.); }
  mat3 rotY(float a){ float c=cos(a), s=sin(a); return mat3(c,0.,-s, 0.,1.,0., s,0.,c); }
  mat3 rotX(float a){ float c=cos(a), s=sin(a); return mat3(1.,0.,0., 0.,c,s, 0.,-s,c); }

  // position of this particle at loop time t; heat 0..1, phase 0 = implosion side, 1 = rebirth side
  vec3 sysPos(float t, out float heat, out float side){
    float r = aOrbit.x, a0 = aOrbit.y, w = aOrbit.z, R = aOrbit.w;
    float delay = aMisc.z, kind = aMisc.w;
    float s = smoother((t - 3.0 - delay*0.9) / 5.7);
    float ang = a0 + w*t + R*s;

    float tStart = 3.0 + delay*1.5;
    float ti = clamp((t - tStart) / (6.0 - tStart), 0., 1.);
    float c = ti*ti*ti;
    float u = clamp((t - 6.0) / (3.0 + delay*0.8), 0., 1.);
    // planets stretch into comet streaks along their orbit: dense coloured head, tapering tail
    gStretch = 0.;
    if (kind > 0.5 && kind < 1.5) {
      float amt = t < 6.0 ? smoothstep(0.05, 0.85, ti) : pow(1.0 - u, 4.0);
      gStretch = pow(aMisc.y, 2.2);
      ang -= gStretch * amt * (0.35 + 0.5*clamp(6.0/r, 0., 1.)) * 1.6;
    }
    float f, scatter = 0.;
    if (t < 6.0) { f = 1.0 - c; heat = c; side = 0.; }
    else { float v = 1.0 - u; f = 1.0 - v*v*v*cos(3.0*PI*u); heat = v*v*v; side = 1.; scatter = pow(sin(PI*u), 2.0); }

    vec3 center = vec3(cos(ang)*r, 0., sin(ang)*r);
    center = rotY(aTilt.y) * (rotX(aTilt.x) * (rotY(-aTilt.y) * center));

    float spin = aTilt.z * TAU * t / LOOP + TAU * 2.0 * s;
    vec3 loc = rotY(spin) * aLocal;
    if (kind < 0.5) { // boiling sun surface, periodic in t
      float ph = TAU * t / LOOP;
      float b = sin(dot(aLocal, vec3(2.1,1.7,1.3)) + ph*3.0) * sin(dot(aLocal, vec3(-1.3,2.4,0.7)) - ph*2.0);
      loc *= 1.0 + 0.09*b;
    }
    vec3 p = center + loc;
    float tw = c*(1.0-c)*4.0;
    float wph = (kind > 0.5 && kind < 1.5) ? aOrbit.y : aMisc.y*TAU;   // planets wobble as one body
    p.y += sin(ang*3.0 + wph) * tw * (r*0.10 + 0.6);
    gF = f;
    p *= f;
    p += aDir * (0.9 * pow(heat, 6.0));            // finite-size singularity core
    // nova burst shell: dust/trails fly wide, planets and sun stay compact so they reform as crisp bodies
    gScatter = scatter;
    float sk = (kind > 0.5 && kind < 1.5) ? 0.025 : kind < 0.5 ? 0.3 : 1.0;
    p += aDir * scatter * sk * (r*0.32 + 4.0);
    return p;
  }
  vec3 heatColor(float heat, float side){
    float h4 = heat*heat*heat*heat;
    vec3 hotIn  = mix(vec3(1.0,0.04,0.55), vec3(0.55,0.1,1.0), h4);   // magenta -> electric violet
    vec3 hotOut = mix(vec3(0.0,0.75,1.0), vec3(0.35,0.45,1.0), h4);   // cyan -> electric blue
    vec3 hot = mix(hotIn, hotOut, side);
    float keep = (aMisc.w > 0.5 && aMisc.w < 1.5) ? 0.12 : side > 0.5 ? 0.45 : 0.85;  // planets keep their own hue; rebirth keeps source hues
    return mix(aColor, hot, smoothstep(0.0, 0.9, heat) * keep);
  }
`;

const geo = new THREE.BufferGeometry();
const f32 = a => new Float32Array(a);
geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
geo.setAttribute('aOrbit', new THREE.BufferAttribute(f32(A.orbit), 4));
geo.setAttribute('aLocal', new THREE.BufferAttribute(f32(A.local), 3));
geo.setAttribute('aDir', new THREE.BufferAttribute(f32(A.dir), 3));
geo.setAttribute('aColor', new THREE.BufferAttribute(f32(A.color), 3));
geo.setAttribute('aMisc', new THREE.BufferAttribute(f32(A.misc), 4));
geo.setAttribute('aTilt', new THREE.BufferAttribute(f32(A.tilt), 3));
geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 500);

const uniforms = { uTime: { value: 0 }, uProj: { value: 1 }, uFlash: { value: 0 }, uDim: { value: 1 } };

const pointsMat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: common + /* glsl */`
    varying vec3 vColor; varying float vAlpha;
    void main(){
      float heat, side;
      vec3 p = sysPos(uTime, heat, side);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      float kind = aMisc.w;
      bool planet = kind > 0.5 && kind < 1.5;
      float size = aMisc.x * (planet ? (1.0 - 0.35*smoothstep(1.0, 0.4, gF) - 0.35*side*(1.0 - heat)) : (1.0 + heat*0.6));
      gl_PointSize = clamp(size * uProj / -mv.z, 1.0, 64.0);
      vColor = heatColor(heat, side);
      float base = kind < 0.5 ? 0.07 : kind < 1.5 ? 0.08 : kind < 2.5 ? 0.6 : 0.22;
      float tw = 0.75 + 0.25*sin(aMisc.y*80.0 + TAU*uTime*2.0/LOOP*(1.0+floor(aMisc.y*3.0)));
      float cool = 1.0 - heat; vAlpha = base * tw * (cool*cool*0.97 + 0.012) * uDim;
      // density clamp: compressed bodies pile up additively, so thin them out as they shrink
      if (planet || kind < 0.5) vAlpha *= mix(0.3, 1.0, clamp(gF*gF*1.3, 0., 1.));
      if (planet) vAlpha *= 1.0 - 0.55*gStretch*smoothstep(1.0, 0.6, gF);
      float psz = size * uProj / -mv.z;   // fade bodies that sweep right past the lens instead of drawing huge clamped sprites
      vAlpha *= clamp(pow(18.0 / max(psz, 1.0), 1.5), 0.0, 1.0);
      if (kind > 1.5) vAlpha *= 1.0 - 0.6*gScatter;   // scattered dust reads as trails (lines), not haze
      if (kind < 1.5 && side > 0.5) vAlpha *= 1.0 - 0.65*gScatter;   // reborn sun/planets stay below the bloom knee: crisp, not blobs
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor; varying float vAlpha;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      float a = 1.0 - smoothstep(0.0, 0.5, d); a *= a;
      gl_FragColor = vec4(vColor * a * vAlpha, 1.0);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
scene.add(new THREE.Points(geo, pointsMat));

// ---------- motion streaks: line segments from p(t-dt) to p(t) ----------
{
  const pick = [];
  const misc = A.misc;
  for (let i = 0; i < count; i++) if (misc[i * 4 + 3] > 0.5 && rnd() < 0.22) pick.push(i);
  const n = pick.length * 2;
  const lg = new THREE.BufferGeometry();
  const names = { aOrbit: 4, aLocal: 3, aDir: 3, aColor: 3, aMisc: 4, aTilt: 3 };
  const src = { aOrbit: A.orbit, aLocal: A.local, aDir: A.dir, aColor: A.color, aMisc: A.misc, aTilt: A.tilt };
  for (const [name, sz] of Object.entries(names)) {
    const out = new Float32Array(n * sz);
    pick.forEach((idx, j) => { for (let e = 0; e < 2; e++) for (let k = 0; k < sz; k++) out[(j * 2 + e) * sz + k] = src[name][idx * sz + k]; });
    lg.setAttribute(name, new THREE.BufferAttribute(out, sz));
  }
  const tail = new Float32Array(n); for (let j = 0; j < pick.length; j++) tail[j * 2 + 1] = 1;
  lg.setAttribute('aTail', new THREE.BufferAttribute(tail, 1));
  lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  lg.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 500);
  const lineMat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: common + /* glsl */`
      attribute float aTail;
      varying vec3 vColor; varying float vAlpha;
      void main(){
        float h0, s0, h1, s1;
        vec3 p0 = sysPos(uTime, h0, s0);
        vec3 p1 = sysPos(mod(uTime - 0.07 + LOOP, LOOP), h1, s1);
        vec3 p = mix(p0, p1, aTail);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        float speed = length(p0 - p1) / 0.07;
        vColor = heatColor(h0, s0);
        vAlpha = clamp((speed - 4.0) * 0.003, 0.0, 0.07 + 0.13*gScatter) * (aMisc.w < 1.5 ? 0.45 : 1.0) * (1.0 - h0*0.8) * (1.0 - aTail * 0.9) * uDim;
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vColor; varying float vAlpha;
      void main(){ gl_FragColor = vec4(vColor * vAlpha, 1.0); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  scene.add(new THREE.LineSegments(lg, lineMat));
}

// ---------- background stars ----------
{
  const n = 7000, pos = new Float32Array(n * 3), c = new Float32Array(n * 3), r = new Float32Array(n);
  const pal = ['#ffffff', '#9fdcff', '#ff9df0', '#c3a6ff', '#7dfcff'].map(col);
  for (let i = 0; i < n; i++) {
    const d = unit(), R = 260 + rnd() * 300;
    pos.set([d[0] * R, d[1] * R, d[2] * R], i * 3);
    c.set(pal[i % pal.length], i * 3); r[i] = rnd();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor', new THREE.BufferAttribute(c, 3));
  g.setAttribute('aRand', new THREE.BufferAttribute(r, 1));
  const m = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: /* glsl */`
      uniform float uTime, uProj, uFlash, uDim; attribute vec3 aColor; attribute float aRand;
      varying vec3 vColor; varying float vA;
      void main(){
        vec3 p = position * (1.0 - 0.06*uFlash);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = max(1.0, (0.6 + aRand*1.2) * uProj / -mv.z);
        vColor = aColor;
        vA = ((0.18 + 0.3*aRand) * (0.7 + 0.3*sin(aRand*200.0 + 6.2831853*uTime*(1.0+floor(aRand*3.0))/10.0)) + uFlash*0.25) * uDim;
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vColor; varying float vA;
      void main(){ float d = length(gl_PointCoord-0.5); float a = 1.0 - smoothstep(0.0,0.5,d); gl_FragColor = vec4(vColor*a*a*vA,1.0); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  scene.add(new THREE.Points(g, m));
}

// ---------- billboard glow: sun core/corona + singularity (point core, anamorphic streak, rays) ----------
const glowU = { uSun: { value: 1 }, uFlash: uniforms.uFlash, uPre: { value: 0 }, uRel: { value: 0 }, uPhase: { value: 0 } };
const glow = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: glowU,
  vertexShader: /* glsl */`
    varying vec2 vP;
    void main(){
      vP = position.xy;
      vec4 mv = viewMatrix * vec4(0.0,0.0,0.0,1.0);
      mv.xy += position.xy * 34.0;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform float uSun, uFlash, uPre, uRel, uPhase; varying vec2 vP;
    void main(){
      float r = length(vP), th = atan(vP.y, vP.x);
      // sun: hot yellow core -> orange -> magenta corona with slow periodic streamers (sun radius ~ 0.088)
      float core = exp(-pow(r/0.05, 2.0));
      float stream = 0.75 + 0.25*sin(th*7.0 + uPhase) * sin(th*3.0 - 2.0*uPhase);
      float cor = exp(-max(r - 0.085, 0.0) * 45.0 / stream) * smoothstep(0.06, 0.09, r);
      vec3 sun = vec3(1.0,0.78,0.08)*core*0.7 + vec3(1.0,0.3,0.0)*exp(-pow(r/0.085,2.0))*0.12
               + mix(vec3(1.0,0.2,0.0), vec3(1.0,0.0,0.6), smoothstep(0.08,0.15,r))*cor*0.8
               + vec3(0.6,0.0,1.0)*exp(-r*10.0)*0.015;
      sun *= uSun;
      // anticipation: a tight point brightens as the swirl contracts onto it
      float pre = exp(-pow(r/0.006, 2.0)) * 3.0 * uPre;
      vec3 preC = vec3(1.0,0.15,0.75) * pre;
      // flash: tiny white-hot point, razor anamorphic streak, radial light rays that run outward on release
      float pt = exp(-pow(r/0.01, 2.0)) * 6.0 + exp(-r*60.0) * 0.5;
      float ax = abs(vP.x), ay = abs(vP.y);
      float streak = exp(-ay/0.0022) * exp(-ax*1.6) * 5.0 + exp(-ay/0.02) * exp(-ax*4.0) * 0.12;
      float streakV = exp(-ax/0.0018) * exp(-ay*9.0) * 1.2;
      float L = 0.08 + uRel*1.1;
      float rays = pow(abs(cos(th*6.0 + 0.3)), 120.0) + 0.6*pow(abs(cos(th*11.0 + 1.1)), 200.0);
      rays *= exp(-r/L) * smoothstep(0.0, 0.02, r) * 1.1;
      vec3 flash = (vec3(1.0,0.95,1.0)*pt + vec3(0.1,0.75,1.0)*streak + vec3(1.0,0.2,0.85)*streakV + mix(vec3(1.0,0.1,0.8), vec3(0.2,0.5,1.0), smoothstep(0.0,0.3,r))*rays) * uFlash;
      vec3 c = sun + preC + flash;
      gl_FragColor = vec4(c * (1.0 - smoothstep(0.7, 1.0, r)), 1.0);
    }`,
  transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
}));
glow.frustumCulled = false; glow.renderOrder = 10;
scene.add(glow);

// ---------- shockwave rings in the ecliptic ----------
const shockU = { uShock: { value: -1 } };
const shock = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: shockU,
  vertexShader: `varying vec2 vP; void main(){ vP = position.xy * 90.0; gl_Position = projectionMatrix * modelViewMatrix * vec4(position*90.0, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform float uShock; varying vec2 vP;
    float ring(float d, float p){
      if (p <= 0.0 || p >= 1.0) return 0.0;
      float R = 70.0 * (1.0 - pow(1.0 - p, 3.0));
      float w = 0.25 + 1.6*p;
      return exp(-pow((d - R)/w, 2.0)) * pow(1.0 - p, 1.8);
    }
    void main(){
      float d = length(vP);
      float a = ring(d, uShock), b = ring(d, uShock - 0.12), c = ring(d, uShock - 0.25);
      vec3 col = vec3(0.1,0.85,1.0)*a*0.9 + vec3(1.0,0.1,0.75)*b*0.7 + vec3(0.55,0.2,1.0)*c*0.5;
      gl_FragColor = vec4(col, 1.0);
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
}));
shock.rotation.x = -Math.PI / 2;
scene.add(shock);

// ---------- post ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.25, 0.5);
composer.addPass(bloom);
// final grade: chromatic aberration, hue-preserving tonemap (scale by max channel, so saturated neon never
// drifts to white), saturation lift, white only allowed via uWhite (the 6 s flash peak), sRGB encode, vignette, grain
const finish = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uAb: { value: 0 }, uTime: { value: 0 }, uWhite: { value: 0 }, uExpo: { value: 1.25 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uAb, uTime, uWhite, uExpo; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + floor(mod(uTime, 10.0)*30.0)*1.37) * 43758.5453); }
    vec3 toSRGB(vec3 c){ c = clamp(c, 0.0, 1.0); return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c)); }
    void main(){
      vec2 d = vUv - 0.5;
      float k = 0.0025 + uAb * 0.012;
      vec3 c;
      c.r = texture2D(tDiffuse, vUv + d*k).r;
      c.g = texture2D(tDiffuse, vUv).g;
      c.b = texture2D(tDiffuse, vUv - d*k).b;
      c = max(c * uExpo, 0.0);
      // saturation lift in linear light (keeps blacks black)
      float l = dot(c, vec3(0.2126,0.7152,0.0722));
      c = max(mix(vec3(l), c, 1.22), 0.0);
      float m = max(max(c.r, c.g), c.b);
      float mt = m * (1.0 + m/16.0) / (1.0 + m);            // extended Reinhard on the max channel
      vec3 hue = c * (mt / max(m, 1e-5));
      c = mix(hue, vec3(mt), uWhite * smoothstep(0.8, 6.0, m));
      c = toSRGB(c);
      float vig = 1.0 - smoothstep(0.3, 0.95, length(d*vec2(1.15,1.0)));
      c *= mix(0.5, 1.0, vig);
      c += vec3(0.004, 0.0, 0.014) * mix(0.6, 1.0, vig);   // deep near-black violet base
      c += (hash(vUv*1000.0) - 0.5) * 0.014;
      gl_FragColor = vec4(c, 1.0);
    }`,
});
composer.addPass(finish);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const ph = h * renderer.getPixelRatio();
  uniforms.uProj.value = ph / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
addEventListener('resize', resize); resize();

// ---------- timeline (all periodic in LOOP) ----------
const smoother = x => { x = Math.min(1, Math.max(0, x)); return x * x * x * (x * (x * 6 - 15) + 10); };
function flashAt(t) {           // short: ignites in the last 40 ms, decays within ~0.5 s
  if (t < 6) return Math.pow(smoother((t - 5.96) / 0.04), 2);
  return Math.exp(-(t - 6) * 5.5);
}
const preAt = t => (t < 6 ? smoother((t - 5.45) / 0.5) : 0);   // anticipation: contraction + dimming
function update(t) {
  uniforms.uTime.value = t;
  const fl = flashAt(t), pre = preAt(t);
  uniforms.uFlash.value = fl;
  uniforms.uDim.value = 1 - 0.6 * pre * (1 - fl);
  glowU.uPre.value = pre * (1 - fl);
  glowU.uRel.value = t >= 6 ? Math.min(1, (t - 6) / 0.8) : 0;
  glowU.uPhase.value = TAU * t / LOOP;
  // sun presence: shrinks with the implosion, reborn after
  const sunCollapse = t < 6 ? Math.pow(smoother((t - 4.0) / 2.0), 2) : 1 - smoother((t - 6.5) / 2.8);
  glowU.uSun.value = 1 - sunCollapse;
  shockU.uShock.value = t >= 6 ? (t - 6) / 2.6 : -1;

  const env = t < 6 ? smoother((t - 2.8) / 3.2) : 1 - smoother((t - 6.2) / 3.6);
  const T = TAU * t / LOOP;
  const az = 0.7 + 0.55 * Math.sin(T) + 0.35 * env;
  const el = 0.5 + 0.1 * Math.sin(2 * T + 1.0) - 0.12 * env;
  const envZ = t < 6 ? Math.pow(env, 1.7) : env;   // zoom lags the collapse so the wide orbits stay in frame
  const widen = 1 + 0.16 * Math.sin(Math.PI * Math.min(1, Math.max(0, (t - 3) / 3)));   // pull back while orbits swell (t 3-6)
  const dist = (74 - 30 * envZ) * widen * (1 - 0.05 * pre) * Math.pow(Math.max(1, 1.5 / camera.aspect), 0.85); // keep the system framed on portrait screens
  const shakeA = t > 6 ? Math.exp(-(t - 6) * 5) * 0.9 : 0;
  camera.position.set(
    dist * Math.cos(el) * Math.sin(az) + shakeA * Math.sin(t * 97),
    dist * Math.sin(el) + shakeA * Math.sin(t * 71 + 1),
    dist * Math.cos(el) * Math.cos(az));
  camera.lookAt(0, 0, 0);
  camera.rotateZ(0.12 * Math.sin(T) + env * 0.15);

  bloom.strength = 0.7 - 0.25 * fl + 0.1 * env;
  bloom.radius = 0.25;
  finish.uniforms.uAb.value = fl * 0.6 + env * 0.3;
  finish.uniforms.uWhite.value = Math.min(1, fl * 1.2);
  finish.uniforms.uTime.value = t;
}

const t0 = performance.now();
let paused = false, pauseAt = 0, offset = 0;
addEventListener('keydown', e => {
  if (e.code === 'Space') { paused = !paused; if (paused) pauseAt = performance.now(); else offset += performance.now() - pauseAt; }
});
function frame(now) {
  const ms = (paused ? pauseAt : now) - t0 - offset;
  const t = frozenT !== null ? ((frozenT % LOOP) + LOOP) % LOOP : (ms / 1000) % LOOP;
  update(t);
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__ready = true;
</script>
</body>
</html>
