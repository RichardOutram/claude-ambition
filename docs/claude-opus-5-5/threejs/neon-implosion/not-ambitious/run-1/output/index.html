<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Solar Implosion</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:crosshair;
    font-family:ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block}
  #hud{position:fixed;left:22px;bottom:20px;color:#bff;letter-spacing:.18em;font-size:11px;
    text-shadow:0 0 8px #0ff,0 0 18px #f0f;pointer-events:none;opacity:.85}
  #hud b{font-size:14px;color:#fff;display:block;margin-bottom:6px}
  #bar{margin-top:10px;width:220px;height:2px;background:rgba(255,255,255,.12);overflow:hidden}
  #fill{height:100%;width:0;background:linear-gradient(90deg,#0ff,#f0f,#ff0);box-shadow:0 0 10px #f0f}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="hud"><b>NEON SOLAR IMPLOSION</b>MOVE · REPEL &nbsp;|&nbsp; HOLD · GRAVITY WELL<div id="bar"><div id="fill"></div></div></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const LOOP = 10;
const FIXED_T = new URLSearchParams(location.search).has('t') ? parseFloat(new URLSearchParams(location.search).get('t')) : null; // debug: ?t=0.7 freezes the loop               // seconds — whole animation is periodic in this
const TAU = Math.PI * 2;
const FOV = 55;

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010004);
const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.1, 3000);

/* ---------- shared timeline (mirrored in the shader) ---------- */
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function collapseK(t) {
  if (t < 0.70) { const s = smooth(0.34, 0.68, t); return s * s * s; }
  if (t < 0.715) return 1;
  return Math.pow(1 - smooth(0.715, 1.0, t), 4);
}
const flashOf = t => Math.exp(-Math.pow((t - 0.715) / 0.012, 2));

/* ---------- particle system build ---------- */
const orbit = [], local = [], color = [], info = [];
const rnd = Math.random;
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
const randDir = () => { const z = rnd() * 2 - 1, a = rnd() * TAU, r = Math.sqrt(1 - z * z); return [r * Math.cos(a), z, r * Math.sin(a)]; };
const C = h => new THREE.Color(h);
function add(R, N, phi, incl, l, M, col, size, bright) {
  orbit.push(R, N, phi, incl);
  local.push(l[0], l[1], l[2], M);
  color.push(col.r, col.g, col.b);
  info.push(size, rnd(), 0, bright);
}
const mix = (a, b, t) => a.clone().lerp(b, t);

// Sun — dense hot core + corona
const sunCols = [C(0xffffff), C(0xfff2a0), C(0xff9a1f), C(0xff2d95), C(0xb026ff)];
for (let i = 0; i < 16000; i++) {
  const corona = rnd() < 0.25;
  const r = corona ? 3 + Math.pow(rnd(), 2) * 5 : 3.2 * Math.pow(rnd(), 1.6);
  const d = randDir();
  const f = Math.min(0.999, r / 8) * (sunCols.length - 1);
  const col = mix(sunCols[Math.floor(f)], sunCols[Math.floor(f) + 1], f % 1);
  add(0, 0, 0, 0, [d[0] * r, d[1] * r, d[2] * r], (rnd() < .5 ? 1 : 2) * (corona ? -1 : 1), col,
      corona ? 0.6 + rnd() : 1.0 + rnd() * 1.2, corona ? 0.22 : 0.28);
}

// Planets: radius, integer turns per loop (keeps it seamless), body size, two neon tones
const planets = [
  { R: 9,  N: 6, s: 0.9, a: 0x00f6ff, b: 0x7dfcff },
  { R: 14, N: 5, s: 1.3, a: 0xff2bd6, b: 0xff8af0 },
  { R: 20, N: 4, s: 1.5, a: 0x39ff14, b: 0xc8ff5a },
  { R: 27, N: 3, s: 1.1, a: 0xff6a00, b: 0xffd000 },
  { R: 41, N: 2, s: 2.6, a: 0x8a2bff, b: 0xff3ea5, ring: true },
  { R: 52, N: 1, s: 2.0, a: 0x00a2ff, b: 0x00ffd5 },
  { R: 62, N: 1, s: 1.6, a: 0xff1744, b: 0xff9ec4 },
];
for (const p of planets) {
  const phi = rnd() * TAU, incl = (rnd() - .5) * 0.18;
  const ca = C(p.a), cb = C(p.b);
  // body
  for (let i = 0; i < 2600; i++) {
    const d = randDir(), r = p.s * Math.pow(rnd(), 0.6);
    add(p.R, p.N, phi, incl, [d[0] * r, d[1] * r, d[2] * r], 3, mix(ca, cb, rnd()), 0.8 + rnd() * 1.0, 0.5);
  }
  // ring system
  if (p.ring) for (let i = 0; i < 4500; i++) {
    const a = rnd() * TAU, r = p.s * (1.6 + rnd() * 1.6);
    const x = Math.cos(a) * r, z = Math.sin(a) * r, y = gauss() * 0.04;
    const tilt = 0.45;
    add(p.R, p.N, phi, incl, [x, y * Math.cos(tilt) - z * Math.sin(tilt) * 0.3, z], 2,
        mix(cb, C(0xffffff), rnd() * .4), 0.5 + rnd() * 0.7, 0.55);
  }
  // orbit dust trail (shares the planet's angular speed)
  for (let i = 0; i < 2600; i++) {
    add(p.R + gauss() * 0.35, p.N, rnd() * TAU, incl, [0, gauss() * 0.15, 0], 0,
        mix(ca, cb, rnd()), 0.35 + rnd() * 0.5, 0.22);
  }
}

// Asteroid belt
for (let i = 0; i < 14000; i++) {
  const R = 31 + rnd() * 5 + gauss() * 0.6;
  add(R, rnd() < 0.5 ? 2 : 3, rnd() * TAU, (rnd() - .5) * 0.06, [0, gauss() * 0.4, 0], 0,
      mix(C(0xb026ff), C(0x00f6ff), rnd()), 0.4 + rnd() * 0.8, 0.35);
}

// Outer nebula halo — gets sucked in too
for (let i = 0; i < 12000; i++) {
  const R = 70 + Math.pow(rnd(), 0.7) * 60;
  add(R, rnd() < 0.5 ? 1 : -1, rnd() * TAU, (rnd() - .5) * 0.9, [0, gauss() * 6, 0], 0,
      mix(C(0xff00aa), C(0x2a6bff), rnd()), 0.4 + rnd() * 1.0, 0.12);
}

const geo = new THREE.BufferGeometry();
const count = orbit.length / 4;
geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
geo.setAttribute('aOrbit', new THREE.Float32BufferAttribute(orbit, 4));
geo.setAttribute('aLocal', new THREE.Float32BufferAttribute(local, 4));
geo.setAttribute('aColor', new THREE.Float32BufferAttribute(color, 3));
geo.setAttribute('aInfo', new THREE.Float32BufferAttribute(info, 4));
geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 400);

const uniforms = {
  uPhase: { value: 0 }, uFlash: { value: 0 },
  uMouse: { value: new THREE.Vector2(9, 9) }, uMouseStr: { value: 0 }, uPress: { value: 0 },
  uAspect: { value: innerWidth / innerHeight }, uTanHalf: { value: Math.tan(THREE.MathUtils.degToRad(FOV / 2)) },
  uPixel: { value: 1 },
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    uniform float uPhase, uFlash, uMouseStr, uPress, uAspect, uTanHalf, uPixel;
    uniform vec2 uMouse;
    attribute vec4 aOrbit, aLocal, aInfo;
    attribute vec3 aColor;
    varying vec3 vColor; varying float vAlpha;
    #define TAU 6.28318530718
    mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
    void main(){
      float t = uPhase, seed = aInfo.y;
      // implosion envelope — staggered per particle, 0 at both loop ends
      float sIn  = smoothstep(0.30 + seed*0.07, 0.68, t);
      float sOut = smoothstep(0.715, 1.0, t);
      float k = t < 0.70 ? sIn*sIn*sIn : (t < 0.715 ? 1.0 : pow(1.0 - sOut, 4.0));

      // orbit (integer turns per loop => seamless) + spiral swirl while collapsing
      float swirl = k * (1.5 + 2.0*seed) * TAU * (1.0 + 10.0/(aOrbit.x + 4.0));
      float a = aOrbit.z + aOrbit.y*TAU*t + swirl;
      vec3 c = vec3(cos(a), 0.0, sin(a)) * aOrbit.x;
      c.yz = rot(aOrbit.w) * c.yz;
      vec3 l = aLocal.xyz;
      l.xz = rot(aLocal.w*TAU*t + k*seed*TAU*3.0) * l.xz;
      vec3 p = c + l;

      // collapse to a singularity, then rebound outwards with an overshoot
      float bounce = t > 0.715 ? sin(3.14159*sOut) * (1.0 - sOut) * 0.6 : 0.0;
      p *= mix(1.0, 0.01 + 0.025*seed, k) + bounce;
      p.y *= 1.0 - 0.8*k;                                 // flatten into an accretion disc
      float turb = k*(1.0-k)*4.0;
      p += turb * (0.4 + aOrbit.x*0.04) * vec3(
        sin(seed*91.0 + t*TAU*7.0), cos(seed*53.0 + t*TAU*5.0), sin(seed*27.0 + t*TAU*9.0));
      p += bounce * normalize(p + 1e-4) * seed * 6.0;    // spray on rebound

      // pointer interaction in screen space
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vec4 clip = projectionMatrix * mv;
      vec2 dd = clip.xy/clip.w - uMouse; dd.x *= uAspect;
      float d2 = dot(dd, dd), dist = sqrt(d2) + 1e-4;
      float infl = exp(-d2 * mix(14.0, 9.0, uPress)) * uMouseStr;
      vec2 dir = dd/dist, perp = vec2(-dir.y, dir.x);
      vec2 repel   = dir*0.17 + perp*0.09;
      vec2 attract = -dd*0.75 + perp*dist*0.6;
      mv.xy += mix(repel, attract, uPress) * infl * (0.6 + 0.8*seed) * (-mv.z) * uTanHalf;
      gl_Position = projectionMatrix * mv;

      float size = aInfo.x * (1.0 + 1.6*infl) * (1.0 - 0.5*k) * (1.0 + 0.5*uFlash);
      gl_PointSize = min(64.0, size * uPixel * 170.0 / -mv.z);

      vec3 col = mix(aColor, mix(vec3(1.0,0.25,0.85), vec3(1.0), k*k), k*0.65);
      col = mix(col, vec3(0.6,1.0,1.0), infl*0.55);
      col *= 1.0 + 0.6*sin(TAU*(t*3.0 + seed));          // shimmer (loops)
      vColor = col;
      vAlpha = aInfo.w * (1.0 + 2.2*infl*(1.0 - 0.85*uPress)) * mix(1.0, 0.05, k*k) * (1.0 + uFlash);
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor; varying float vAlpha;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float g = (exp(-d*d*26.0) + smoothstep(0.14, 0.0, d)*0.8) * smoothstep(0.5, 0.3, d);
      gl_FragColor = vec4(vColor * g * vAlpha, 1.0);
    }`,
});
scene.add(new THREE.Points(geo, mat));

/* ---------- background stars ---------- */
{
  const n = 5000, pos = new Float32Array(n * 3), sd = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const d = randDir(), r = 600 + rnd() * 600;
    pos.set([d[0] * r, d[1] * r, d[2] * r], i * 3); sd[i] = rnd();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(sd, 1));
  scene.add(new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `uniform float uPhase, uPixel, uFlash; attribute float aSeed; varying float vA; varying vec3 vC;
      void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*mv;
        vA = 0.5*(0.25 + 0.75*abs(sin(6.2831853*(uPhase*2.0 + aSeed)))) * (1.0 + uFlash);
        vC = mix(vec3(0.5,0.8,1.0), vec3(1.0,0.5,1.0), aSeed);
        gl_PointSize = (0.8 + aSeed*1.4) * uPixel; }`,
    fragmentShader: `varying float vA; varying vec3 vC;
      void main(){ float d = length(gl_PointCoord-.5); if(d>.5) discard; gl_FragColor = vec4(vC*vA*(1.-d*2.), 1.); }`,
  })));
}

/* ---------- shockwave rings ---------- */
function makeRing(tilt) {
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uR: { value: 0 }, uA: { value: 0 }, uW: { value: 1 }, uPhase: uniforms.uPhase },
    vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform float uR, uA, uW, uPhase; varying vec2 vP;
      void main(){ float d = length(vP); float a = atan(vP.y, vP.x);
        float r = exp(-pow((d-uR)/uW, 2.0));
        vec3 c = 0.5 + 0.5*cos(6.2831853*(a/6.2831853 + uPhase*2.0 + vec3(0.0,0.33,0.67)));
        c = mix(c, vec3(1.0,0.2,0.9), 0.3);
        gl_FragColor = vec4(c * r * uA, 1.0); }`,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(320, 320), m);
  mesh.rotation.x = -Math.PI / 2 + tilt;
  scene.add(mesh);
  return m.uniforms;
}
const ringOut = makeRing(0), ringOut2 = makeRing(0.9), ringIn = makeRing(0.15);

/* ---------- core glow sprite ---------- */
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.15, 'rgba(255,200,255,.8)');
  gr.addColorStop(.4, 'rgba(255,40,180,.25)'); gr.addColorStop(1, 'rgba(60,0,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
scene.add(glow);

/* ---------- post ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const after = new AfterimagePass(0.8);
composer.addPass(after);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.0, 0.55, 0.12);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- pointer ---------- */
const mouse = new THREE.Vector2(9, 9), mouseS = new THREE.Vector2(0, 0);
let lastMove = -1e9, pressed = false, strTarget = 0;
function setPointer(e) {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  lastMove = performance.now();
}
addEventListener('pointermove', setPointer);
addEventListener('pointerdown', e => { setPointer(e); pressed = true; });
addEventListener('pointerup', () => pressed = false);
addEventListener('pointercancel', () => pressed = false);
document.addEventListener('pointerleave', () => { lastMove = -1e9; pressed = false; });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h); bloom.resolution.set(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  uniforms.uAspect.value = w / h;
  uniforms.uPixel.value = renderer.getPixelRatio() * Math.max(0.6, h / 900);
}
addEventListener('resize', resize); resize();

/* ---------- loop ---------- */
const fill = document.getElementById('fill');
const start = performance.now();
let prev = start;
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  const t = FIXED_T ?? (((now - start) / 1000) % LOOP) / LOOP;
  const k = collapseK(t), flash = flashOf(t);

  // pointer smoothing
  const active = pressed || now - lastMove < 2500;
  strTarget = active ? 1 : 0;
  const ease = 1 - Math.exp(-dt * 6);
  uniforms.uMouseStr.value += (strTarget - uniforms.uMouseStr.value) * ease;
  uniforms.uPress.value += ((pressed ? 1 : 0) - uniforms.uPress.value) * (1 - Math.exp(-dt * 4));
  uniforms.uMouse.value.lerp(mouse, 1 - Math.exp(-dt * 14));
  if (mouse.x < 5) mouseS.lerp(mouse, 1 - Math.exp(-dt * 2));

  uniforms.uPhase.value = t;
  uniforms.uFlash.value = flash;

  // camera: looping sway + pointer parallax + dolly-in during implosion + shake on collapse
  const az = 0.4 * Math.sin(TAU * t) + mouseS.x * 0.5;
  const el = 0.52 + 0.1 * Math.sin(TAU * t * 2) - mouseS.y * 0.25;
  const dist = 105 - 38 * k;
  const shake = flash * 1.8 + k * (1 - k) * 0.6;
  camera.position.set(
    Math.sin(az) * Math.cos(el) * dist + (rnd() - .5) * shake,
    Math.sin(el) * dist + (rnd() - .5) * shake,
    Math.cos(az) * Math.cos(el) * dist);
  camera.lookAt(0, 0, 0);

  // rings: inward ring during implosion, two outward shockwaves after collapse
  const sIn = smooth(0.38, 0.69, t);
  ringIn.uR.value = 110 * (1 - sIn * sIn); ringIn.uW.value = 0.6 + 1.2 * (1 - sIn);
  ringIn.uA.value = Math.sin(Math.PI * sIn) * 0.35;
  const so = Math.max(0, (t - 0.715) / 0.285), e1 = 1 - Math.pow(1 - so, 3);
  ringOut.uR.value = e1 * 150; ringOut.uW.value = 0.5 + e1 * 3; ringOut.uA.value = t > 0.715 ? Math.pow(1 - so, 2) * 0.7 : 0;
  const so2 = Math.max(0, (t - 0.735) / 0.265), e2 = 1 - Math.pow(1 - so2, 3);
  ringOut2.uR.value = e2 * 110; ringOut2.uW.value = 0.4 + e2 * 2; ringOut2.uA.value = t > 0.735 ? Math.pow(1 - so2, 2.5) * 0.5 : 0;

  // core glow
  const pulse = 1 + 0.08 * Math.sin(TAU * t * 5);
  glow.scale.setScalar((16 * pulse) * (1 - 0.5 * k) + flash * 110);
  glow.material.opacity = Math.min(1, 0.35 + 0.3 * k + 0.6 * flash);

  bloom.strength = 0.85 + 0.3 * k + 1.2 * flash;
  after.uniforms.damp.value = 0.78 + 0.14 * k;

  fill.style.width = (t * 100).toFixed(2) + '%';
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
